[versions]
android-gradle-plugin = "9.2.1"
kotlin = "2.2.21"
ksp = "2.3.7"
androidx-activity = "1.13.0"
androidx-compose-bom = "2026.04.00"
androidx-lifecycle = "2.10.0"
androidx-navigation3 = "1.1.1"
androidx-room = "2.8.4"
androidx-test-core = "1.7.0"
hilt = "2.59.2"
