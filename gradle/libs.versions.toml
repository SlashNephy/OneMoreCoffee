ktor = "3.4.3"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.11.0"
android-maps-compose = "8.3.0"
play-services-maps = "20.0.0"
play-services-location = "21.3.0"
mapsplatform-secrets = "2.0.1"
junit = "4.13.2"
robolectric = "4.16.1"
truth = "1.4.5"
